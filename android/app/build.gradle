apply plugin: 'com.android.application'
// Ajoute le 25/08/2026, Bourama : Lot 3B (fusion Capacitor), voir
// android/build.gradle pour le classpath correspondant.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// Ajoute le 25/08/2026, Bourama : Lot 3C (Phase 3, fusion Capacitor).
// Isolation play/externe deja actee et deja implementee cote natif (voir
// clovis-mobile/android-legacy-natif/app/build.gradle.kts et
// clovis-mobile/android-legacy-natif/README-SIGNATURE.md), reprise ici a
// l'identique pour ce conteneur Capacitor, qui est desormais le seul socle
// (clovis-mobile/android abandonne, voir android/keystore.properties.example
// pour la suite). Isolation au niveau du build, pas d'un simple interrupteur
// en code : "externe" reste le seul flavor pouvant embarquer le service
// d'accessibilite, une fois celui-ci migre en plugin Capacitor (pas encore
// fait ici, seule l'isolation du build est posee par ce lot).
def fichierKeystore = rootProject.file('keystore.properties')
def proprietesKeystore = new Properties()
if (fichierKeystore.exists()) {
    fichierKeystore.withInputStream { proprietesKeystore.load(it) }
}

android {
    namespace = "com.clovis.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clovis.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Ajoute le 25/08/2026 : requis par le plugin Compose (AlerteRappelActivity).
    buildFeatures {
        compose true
    }

    // Ajoute le 25/08/2026, Bourama : Lot 3C (fusion Capacitor). Signature
    // manuelle du flavor "externe", lue depuis un fichier LOCAL jamais
    // committe (voir android/README-SIGNATURE.md). Absent -> pas de
    // signingConfig applique ; le flavor "play" (signe par Google Play App
    // Signing) n'en a de toute facon pas besoin.
    signingConfigs {
        if (fichierKeystore.exists()) {
            externe {
                storeFile file(proprietesKeystore.getProperty('storeFile'))
                storePassword proprietesKeystore.getProperty('storePassword')
                keyAlias proprietesKeystore.getProperty('keyAlias')
                keyPassword proprietesKeystore.getProperty('keyPassword')
            }
        }
    }

    flavorDimensions "distribution"
    productFlavors {
        play {
            dimension "distribution"
            // Aucun applicationIdSuffix : c'est l'id publie sur le Play
            // Store (com.clovis.app, deja reutilise tel quel du socle
            // natif). Signature geree automatiquement par Google Play App
            // Signing, rien a configurer ici.
        }
        externe {
            dimension "distribution"
            // Suffixe distinct : jamais le meme id que la version Play
            // Store, pour eviter tout conflit d'installation cote-a-cote et
            // bien marquer qu'il s'agit d'une distribution differente.
            applicationIdSuffix ".externe"
            versionNameSuffix "-externe"
            if (fichierKeystore.exists()) {
                signingConfig signingConfigs.externe
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Ajoute le 25/08/2026, Bourama : Lot 3B (fusion Capacitor).
    // Migre depuis clovis-mobile/android/app/build.gradle.kts, memes
    // versions exactes (deja verifiees/corrigees la-bas les 23-24/08).

    // pont/ClovisApiClient.kt : client HTTP vers clovis-backend. Memes
    // versions exactes que clovis-mobile/android/app/build.gradle.kts.
    implementation "io.ktor:ktor-client-android:3.4.0"
    implementation "io.ktor:ktor-client-content-negotiation:3.4.0"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.4.0"

    // pont/StockageToken.kt : stockage chiffre du token recu du JS.
    implementation "androidx.security:security-crypto:1.1.0"

    // notifications/*.kt : FCM (cles Firebase pas encore configurees,
    // voir ClovisFirebaseApp.kt ; ne bloque pas la compilation).
    implementation "com.google.firebase:firebase-messaging:25.1.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    // notifications/AlerteRappelActivity.kt : ecran Compose plein ecran.
    // Memes versions exactes que clovis-mobile/android/app/build.gradle.kts.
    implementation "androidx.activity:activity-compose:1.12.1"
    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
