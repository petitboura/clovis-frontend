apply plugin: 'com.android.application'
// Ajoute le 25/08/2026, Bourama : Lot 3B (fusion Capacitor), voir
// android/build.gradle pour le classpath correspondant.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// Ajoute le 25/08/2026, Bourama : Lot 3C (Phase 3, fusion Capacitor).
// Isolation play/externe deja actee et deja implementee cote natif (voir
// clovis-mobile/android-legacy-natif/app/build.gradle.kts et
// clovis-mobile/android-legacy-natif/README-SIGNATURE.md), reprise ici a
// l'identique pour ce conteneur Capacitor, qui est desormais le seul socle
// (clovis-mobile/android abandonne, voir android/keystore.properties.example
// pour la suite). Isolation au niveau du build, pas d'un simple interrupteur
// en code : "externe" est le flavor qui embarque le service d'accessibilite
// (lots 6-7) et la mise a jour hors-store (lot 8), tous deux migres en
// plugins Capacitor depuis (voir app/src/externe/java/com/clovis/app/).
def fichierKeystore = rootProject.file('keystore.properties')
def proprietesKeystore = new Properties()
if (fichierKeystore.exists()) {
    fichierKeystore.withInputStream { proprietesKeystore.load(it) }
}

android {
    namespace = "com.clovis.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.clovis.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Ajoute le 25/08/2026 : requis par le plugin Compose (AlerteRappelActivity).
    // buildConfig true : requis par VerificateurMiseAJour.kt (Lot 8, flavor
    // externe uniquement) qui lit BuildConfig.VERSION_NAME.
    buildFeatures {
        compose true
        buildConfig true
    }

    // Ajoute le 25/08/2026, Lot 6-7 portes : deux flavors comme
    // clovis-mobile/android-legacy-natif (voir 00-commun.md, "isolation au
    // niveau du build, pas d'un simple interrupteur en code"). "play" =
    // publiable Play Store (lots 1-5 seulement, aucun code accessibilite
    // compile dedans). "externe" = ajoute l'accessibilite + mise a jour
    // hors-store (lots 6-8), jamais soumis au Play Store.
    // Signature du flavor externe : lit android/keystore.properties (local,
    // jamais committe, gitignore) -- voir android/README-SIGNATURE.md pour
    // generer la cle dans CE projet. Sans ce fichier, "externe" compile quand
    // meme mais n'est pas signe (comme cote clovis-mobile).
    signingConfigs {
        if (fichierKeystore.exists()) {
            externe {
                storeFile file(proprietesKeystore.getProperty("storeFile"))
                storePassword proprietesKeystore.getProperty("storePassword")
                keyAlias proprietesKeystore.getProperty("keyAlias")
                keyPassword proprietesKeystore.getProperty("keyPassword")
            }
        }
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        play {
            dimension "distribution"
        }
        externe {
            dimension "distribution"
            applicationIdSuffix ".externe"
            versionNameSuffix "-externe"
            // Lot 8 : signature manuelle, TOUJOURS la meme cle d'une version
            // a l'autre (voir README-SIGNATURE.md), sinon aucune mise a jour
            // ne pourra s'installer par-dessus l'app existante.
            if (fichierKeystore.exists()) {
                signingConfig signingConfigs.externe
            }
        }
    }

}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Ajoute le 25/08/2026, Bourama : Lot 3B (fusion Capacitor).
    // Migre depuis clovis-mobile/android/app/build.gradle.kts, memes
    // versions exactes (deja verifiees/corrigees la-bas les 23-24/08).

    // pont/ClovisApiClient.kt : client HTTP vers clovis-backend. Memes
    // versions exactes que clovis-mobile/android/app/build.gradle.kts.
    implementation "io.ktor:ktor-client-android:3.4.0"
    implementation "io.ktor:ktor-client-content-negotiation:3.4.0"
    implementation "io.ktor:ktor-serialization-kotlinx-json:3.4.0"

    // pont/StockageToken.kt : stockage chiffre du token recu du JS.
    implementation "androidx.security:security-crypto:1.1.0"

    // notifications/*.kt : FCM (cles Firebase pas encore configurees,
    // voir ClovisFirebaseApp.kt ; ne bloque pas la compilation).
    implementation "com.google.firebase:firebase-messaging:25.1.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"

    // notifications/AlerteRappelActivity.kt : ecran Compose plein ecran.
    // Memes versions exactes que clovis-mobile/android/app/build.gradle.kts.
    implementation "androidx.activity:activity-compose:1.12.1"
    implementation platform("androidx.compose:compose-bom:2026.06.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"

    // dossiers/DossiersDesignesRepository.kt : SAF (Storage Access Framework),
    // Lot 2 porte le 25/08/2026. Meme version exacte que
    // clovis-mobile/android-legacy-natif/app/build.gradle.kts.
    implementation "androidx.documentfile:documentfile:1.0.1"

    // connecteurs/ConnecteursPlugin.kt : Custom Tabs pour l'OAuth Notion,
    // Lot 5 porte le 25/08/2026. Meme version que clovis-mobile -- A VERIFIER
    // par Bourama dans Android Studio : clovis-mobile a du monter cette lib a
    // 1.10.0 a cause de auth-kt (Supabase natif), absent ici (le token vient
    // du JS, pas de supabase-kt natif) -- 1.8.0 devrait donc suffire, mais
    // pas verifie avec compileSdk 36 dans CE projet precis.
    implementation "androidx.browser:browser:1.8.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
